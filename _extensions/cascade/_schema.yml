$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v1/extension-schema.json

options:
  keep-hrule:
    type: boolean
    default: false
    description: >
      Whether to keep horizontal rules (`---`) in non-reveal.js formats.
      When `false`, horizontal rules are removed from the output.
  depth:
    type: number
    description: >
      Maximum number of heading levels of the chain to repeat on continuation
      slides, counted from the slide level. When unset, the full chain is
      repeated. The `cascade-depth` heading attribute overrides this value
      for the chain starting at that heading.
